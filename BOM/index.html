    <!-- 5. setTimeout — Auto-Hide a Success Message
Real Use: "Item added to cart!" messages that disappear after a few seconds. -->
    <button onclick="showMessage()">Add to Cart</button>
    <p id="msg"></p>

    <script>
      function showMessage() {
        const msg = document.getElementById("msg");
        msg.textContent = "✅ Added to cart!";

        setTimeout(() => {
          msg.textContent = ""; // message disappears after 2 seconds
        }, 2000);
      }
    </script>
